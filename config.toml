# hal-mary configuration. Every tunable lives here — models, cadences, tool
# allowlists, timeouts and budgets. Code reads these through hal_mary.config;
# nothing in src/ hardcodes a model name, timeout or cadence.

[claude]
binary = "claude"                  # overridable so tests point at a fake
default_model = "opus"
permission_mode = "dontAsk"
scratch_dir = ".hal-mary-scratch"  # cwd for claude subprocesses, never the repo
system_prompt_file = "prompts/system.md"

[paths]
prompts_dir = "prompts"
memory_dir = "memory"

[draft]
# Three cadences, one loop, chosen from what ESPN's own draft board says.
#
# poll_seconds is draft night and nothing else: five seconds is what a 90-second
# pick clock needs. idle_poll_seconds is every other day of the year — the draft
# is a single evening, and five minutes is soon enough to notice one opening.
# When every slot on the board has a real player in it the loop stops polling
# altogether, because there is nothing left to watch.
#
# Five seconds around the clock is 17,280 requests a day, 2,073,600 over a
# season, against an unofficial API on one household's cookies, for a job that
# needs about 2,160 of them once. The phases cost about 37,000.
poll_seconds = 5
idle_poll_seconds = 300
advise_within_picks = 2

# How long "The draft has started" holds the loop at draft-night cadence before
# the board has to justify it. The button exists because ESPN draws the real
# order when the draft opens and hal-mary cannot read it until a pick lands, so
# the override has to outlive that gap; an hour covers it several times over. A
# stray tap therefore costs an hour of fast polling, not a season of it.
live_override_seconds = 3600

# How much of the board each prompt sees. board_size is the pre-draft research
# job, which has fifteen minutes. The advice_* sizes run against a 90-second
# pick clock: bigger is better reasoning right up until the answer arrives after
# the pick was due. advice_retry_candidates is the shorter second attempt.
board_size = 200
research_note_limit = 30

# The largest share of the board any one website may be the deciding source
# for. Measured defect: the first real build cited a single ranking article for
# 103 of 200 players, which is a board every other manager in the league can
# already read for free. At 0.25 no outlet may decide more than 50 of 200, so
# the ordering has to come from weighing sources against each other rather than
# from retyping one of them. Raise it and the board drifts back towards being a
# copy; lower it and the research spends its time hunting for a fourth opinion
# on a player nobody disagrees about.
max_source_share = 0.25
advice_candidates = 14
advice_retry_candidates = 5
advice_recent_picks = 8
advice_note_limit = 12

# Wall-clock seconds one tick may spend before Caroline has a card. The clock
# starts before the ESPN sync, so a slow read spends this budget like anything
# else — but it bounds only what the advisor chooses to start, not a request
# already in flight. See the worked sum above [jobs.draft_advice].
advice_budget_s = 60

# The manual fallback for the league's own settings.
#
# Normally `hal-mary sync` reads these from ESPN into the league_settings table
# and nothing below is read. Uncomment and fill this in when there are no
# working ESPN credentials: it is the difference between hal-mary running the
# draft from hand-entered picks and being unable to help at all.
#
# A synced row always wins, field by field, so a filled-in section here stays
# harmless once ESPN works — and it still covers a sync that landed without the
# roster slots. Having this section does not disable syncing.
#
# draft_order is team ids or team names by first-round slot; names are what the
# ESPN draft lobby shows. my_draft_slot is Caroline's 1-based place in round 1.
#
# [league]
# team_count = 6
# scoring_type = "full PPR"
# points_per_reception = 1.0    # 1.0 full PPR, 0.5 half PPR, 0.0 standard
# draft_type = "SNAKE"
# draft_order = [1, 2, 3, 4, 5, 6]
# my_draft_slot = 6
#
# What the season is a race for. ESPN reports these in scheduleSettings; state
# them here when there is no ESPN, because "how many teams make the playoffs
# and how the places are decided" changes which board is right and hal-mary
# says "not known" rather than guessing.
#
# playoff_team_count = 4
# playoff_seeding_rule = "TOTAL_POINTS_SCORED"   # or anything else for won-lost record
# regular_season_weeks = 14
#
# [league.roster_slots]         # one draft round per slot, IR excluded
# QB = 1
# RB = 2
# WR = 2
# TE = 1
# "D/ST" = 1
# K = 1
# "RB/WR/TE" = 1               # the flex slot; ESPN spells it this way
# BE = 7                       # bench
# IR = 1                       # injured reserve; not drafted

# How much live state the four in-season research jobs put in front of Claude.
# Sizes only: when each job runs is the `cron` on its [jobs.*] entry below.
#
# free_agent_size is how deep into the waiver wire to look. ESPN returns free
# agents most-owned first, and in a six-team league the interesting names are
# much further down that list than a twelve-team guide would suggest, because
# far more good players go unowned. The shortlist is what actually reaches the
# prompt; the rest are pulled so a job can filter before spending tokens.
[research]
free_agent_size = 60
free_agent_shortlist = 40
note_limit = 30
note_shelf_life_days = 14
waiver_claims = 5

# What phase hal-mary thinks it is in, which decides which jobs are scheduled at
# all. The windows are generous on purpose: ESPN draft times slip, and having
# the draft page in fast mode early costs a few polls while being late costs
# picks. season_days ends the season without anybody turning anything off.
[scheduler]
draft_window_before_hours = 6
draft_window_after_hours = 12
season_days = 150
phase_cron = "20 4 * * *"
# Every cadence below is read in this zone, not UTC. The jobs are timed against
# NFL kickoffs, and "Sunday morning" in UTC is 2am Pacific.
timezone = "America/Los_Angeles"
# How late a fire may be and still run. APScheduler defaults to one second, so a
# fire missed while the loop was blocked is dropped in silence.
misfire_grace_time_s = 3600

[espn]
# Transport limits for the raw ESPN reads. Bounded by the pick clock above: a
# read that outlives its poll interval silently stops the draft loop, and a
# hung request during a draft is worse than a failed one.
connect_timeout_s = 10.0
read_timeout_s = 15.0

[backup]
# The nightly snapshot of the database, written by `hal-mary backup` and run by
# deploy/hal-mary-backup.timer. The database is the only thing here that cannot
# be regenerated: the ESPN state resyncs and the board rebuilds, but the season's
# accumulated notes exist nowhere else.
#
# `dir` is deliberately unset: it then means "a backups/ directory beside the
# database", which on the VM is ~/hal-mary-data/backups — on the box's own disk,
# and outside the checkout that a deploy replaces. Set it only to move backups
# somewhere else on local disk; a value here is anchored to this file's
# directory, so pointing it into the checkout would put the backups in the one
# place a redeploy wipes.
#
# `keep` is a count of files rather than days, because the timer can miss a
# night — the box was off — and "the last fourteen" is the window someone
# reasons about while restoring.
keep = 14

[web]
host = "0.0.0.0"                   # every interface: this is opened from a phone
port = 8080
session_cookie = "hal_mary_session"
csrf_cookie = "hal_mary_csrf"      # the double-submit token for state-changing posts
session_max_age_days = 30          # she must not be logged out mid-draft
sse_heartbeat_s = 15.0             # comment frame that keeps a phone's stream open

# Which upstream addresses may set X-Forwarded-Proto / X-Forwarded-For.
#
# Empty means nothing is in front of us, which is right for the LAN address.
# Behind the homelab's Traefik (https://chaos-theory.thehalf.io) this must name
# the proxy: uvicorn otherwise trusts 127.0.0.1 only and drops the headers in
# silence, so the app sees scheme "http" on an https site and sets the session
# cookie WITHOUT Secure. The page works; the cookie is downgraded. Set this to
# the ingress address, or "*" when nothing but the proxy can reach the port.
forwarded_allow_ips = "192.168.1.163"   # birdo, the host Traefik runs on
auth_check_seconds = 3600          # how often the status page re-checks the ESPN cookies
login_max_attempts = 5             # wrong passwords from one device before it is locked out
login_lockout_seconds = 60.0       # and for how long

# How far behind the draft sync may fall before the draft page bands itself with
# a warning, and how often the page re-fetches once its event stream has dropped.
# Both are sized against the pick clock: 30 seconds is a third of a 90-second
# turn, which is late enough not to cry wolf and early enough to matter.
draft_stale_seconds = 30
live_poll_ms = 10000

# How long uvicorn may wait for open connections before it stops the server
# anyway. It has to be bounded and it has to be short: uvicorn waits for
# connections *before* running lifespan shutdown, which is where the draft loop
# is told to stop — and the draft page holds /events open for as long as a phone
# has it open. Without this, a phone on the sofa means SIGTERM never finishes,
# the loop keeps polling ESPN, and a deploy leaves it behind.
shutdown_timeout_s = 5

[chat]
# How much hal-mary puts in front of the model when Caroline asks a question,
# and how much of the conversation the page itself shows.
#
# note_limit is larger than the draft's because a chat question has no pick
# clock. The whole point of the page is the question a dashboard could not
# anticipate, and a thin retrieval is exactly how that gets a thin answer.
#
# Notes are retrieved with no age cutoff here, unlike every other job: "how has
# my season gone" is a question about things that happened months ago.
note_limit = 25
advice_limit = 5          # recent recommendations shown to the model and the page
session_limit = 20        # conversations listed down the side of the page

[jobs.board_build]
model = "opus"
tools = ["WebSearch", "WebFetch"]
timeout_s = 900
max_budget_usd = 5.0
enabled = true
cron = "0 6 * * *"          # every morning, before the draft

# The two on-the-clock attempts. Both run with no web tools, and their deadlines
# are a budget against the pick clock, which this league sets at 90 seconds
# (draftSettings.timePerSelection, read into LeagueContext.pick_clock_s).
#
# What one timed-out attempt actually costs:
#
#   its own deadline                    timeout_s below
#   + claude_runner.TIMEOUT_TEARDOWN_S  7s — SIGKILL reap 5s + stdout join 2s,
#                                       both OUTSIDE timeout_s
#
# So, worst case, the Claude half of a tick:
#
#   first attempt, timing out        25s   jobs.draft_advice.timeout_s
#     + its teardown                  7s
#   retry, timing out                15s   jobs.draft_advice_retry.timeout_s
#     + its teardown                  7s
#   deterministic fallback card      ~0s   pure arithmetic over the board
#                                   ----
#   Claude spend, worst case         54s   <= draft.advice_budget_s (60)
#
# WHAT IS GUARANTEED, AND WHAT IS NOT.
#
# The advisor checks the remaining budget before each attempt and starts one only
# if it can finish, teardown included. That bounds the *Claude* spend: it can
# never push a tick past draft.advice_budget_s, and when nothing fits the
# deterministic card renders at once instead of after two more slow calls.
#
# It does NOT bound the ESPN reads, because it cannot cancel an HTTP request
# already in flight. A tick makes up to three of them — warm()'s player_name_map
# on the first tick, draft_picks() (which fetches the name map itself if the warm
# failed), and _read_schedule() on the tick the draft opens — and httpx's
# connect/read timeouts are per operation, not per request, so each is nominally
# 25s and can be more. Worst-case ESPN spend is therefore roughly 50-75s, and the
# true bound on a tick is max(advice_budget_s, whatever ESPN took), not 60.
#
# That is the right shape anyway: ESPN spending 50 seconds leaves 10, nothing
# fits, and Caroline gets the board's own card immediately rather than nothing.
# If ESPN worst cases start actually happening, the lever is espn.read_timeout_s
# above, not these two numbers.
#
# Measured: a tools-off call with a JSON schema returns in about 15 seconds, so
# 25s is comfortable for the full prompt and 15s is comfortable for the retry,
# whose prompt carries five candidates and no notes. Raising either tightens the
# margin; raising both past the budget silently costs the retry — which is now a
# real loss, because a budget too small for the first attempt still affords the
# second.
[jobs.draft_advice]
model = "opus"
tools = []                # no web tools: this runs on the pick clock
timeout_s = 25
max_budget_usd = 1.0
enabled = true

[jobs.draft_advice_retry]
model = "opus"
tools = []                # no web tools: this runs on the pick clock too
timeout_s = 15            # shorter on purpose: the first attempt already spent time
max_budget_usd = 1.0
enabled = true

[jobs.chat]
model = "opus"
tools = ["WebSearch", "WebFetch"]
timeout_s = 300
max_budget_usd = 2.0
enabled = true

[jobs.news_sweep]
model = "opus"
tools = ["WebSearch", "WebFetch"]
timeout_s = 900
max_budget_usd = 3.0
enabled = true
cron = "0 7 * * wed,sat"    # first in the week, then once the weekend has landed

[jobs.waiver_scan]
model = "opus"
tools = ["WebSearch", "WebFetch"]
timeout_s = 900
max_budget_usd = 3.0
enabled = true
cron = "0 8 * * tue"        # before ESPN processes claims on Wednesday

[jobs.lineup_check]
model = "opus"
tools = ["WebSearch", "WebFetch"]
timeout_s = 600
max_budget_usd = 3.0
enabled = true
# Three cadences, not one. ESPN locks each player at HIS OWN kickoff, so a
# Thursday starter ruled out on Wednesday is lost by Sunday morning. Sunday
# 08:00 is two hours before the earliest kickoff (10:00 Pacific); Thursday and
# Monday 15:00 is a little over two hours before those night games.
cron = ["0 8 * * sun", "0 15 * * thu", "0 15 * * mon"]

[jobs.weekly_recap]
model = "opus"
tools = ["WebSearch", "WebFetch"]
timeout_s = 600
max_budget_usd = 2.0
enabled = true
cron = "0 10 * * tue"       # after the week has finished, with the waiver scan

[cowork]
# Claude Cowork's scheduled tasks are declared in cowork/tasks.toml; this is how
# they are rendered. `hal-mary cowork-config` prints the schedule for this
# league, deriving the waiver run from the league's own processing day.
#
# timezone is the zone Cowork's own scheduling form uses — the operator's local
# zone, not the server's. The box runs UTC and the person filling in the form
# does not, and a bare hour with no zone beside it is how a lineup run ends up
# scheduled six hours after kickoff.
#
# It must match [scheduler].timezone above. They are separate keys because they
# are separate ideas — one is the zone hal-mary's own cron runs in, the other is
# what a person types into somebody else's web form — but the two schedules
# interleave: hal-mary works out the lineup changes and Cowork performs them, so
# a Cowork run that drifts in front of the check that fills its queue finds
# nothing to do and says so, correctly, forever. `hal-mary cowork-config` warns
# when they differ and a test refuses a config in which they do.
timezone = "America/Los_Angeles"

# How far ahead of waiver processing a claim run happens. ESPN processes claims
# in a batch, so a run after that time submits into a window that has closed; a
# day ahead leaves room for a failed run to be noticed and repeated.
waiver_lead_minutes = 1440

[actions]
# When an NFL week rolls over, for the purpose of expiring an instruction that
# was queued for Claude Cowork.
#
# Two things hang off this one boundary. Every emitted action expires at it — a
# lineup change is worthless once the week it was reasoned about is over, and an
# executor that has been offline for a fortnight must not come back and perform
# it. And emission equivalence is scoped by it: the same bench twice in one week
# is a duplicate, the same bench next week is a new decision (on bye then,
# injured now) and suppressing it would lose a real change.
#
# Tuesday 11:00 UTC is after Monday night's game (which ends around 04:15 UTC on
# Tuesday) and around when ESPN rolls its scoring period. UTC because that is the
# only clock the database stores.
week_boundary_weekday = "tuesday"
week_boundary_hour_utc = 11
