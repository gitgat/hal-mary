[project]
name = "hal-mary"
version = "0.1.0"
description = "Claude-powered fantasy football advisor"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
    "espn-api>=0.46",
    "apscheduler>=3.10",
    "pydantic>=2",
    "python-dotenv",
    "httpx",
]

[project.scripts]
hal-mary = "hal_mary.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hal_mary"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
